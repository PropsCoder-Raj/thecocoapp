<IfModule mod_ssl.c>
<VirtualHost *:443>

    ServerAdmin webmaster@localhost

   ServerName thecocoapp.com

    DocumentRoot /var/www/html/build/



    ErrorLog ${APACHE_LOG_DIR}/error.log

    CustomLog ${APACHE_LOG_DIR}/access.log combined



	<Directory /var/www/html/build>
	
	Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

	</Directory>



RewriteEngine on

# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =thecocoapp.com
# 
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

# ServerName www.thecocoapp.com
# Redirect 301 / https://thecocoapp.com/


ServerAlias thecocoapp.com
SSLCertificateFile /etc/letsencrypt/live/thecocoapp.com-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/thecocoapp.com-0001/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
