<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName node.thecocoapp.com

    RewriteEngine On
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

#     RewriteCond %{HTTPS} off
#     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://localhost:8080/
    ProxyPassReverse / http://localhost:8080/

    ErrorLog ${APACHE_LOG_DIR}/node.thecocoapp.com_error.log
    CustomLog ${APACHE_LOG_DIR}/node.thecocoapp.com_access.log combined


SSLCertificateFile /etc/letsencrypt/live/node.thecocoapp.com-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/node.thecocoapp.com-0001/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
